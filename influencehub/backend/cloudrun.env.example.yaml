# Non-secret runtime configuration for Cloud Run.
# Copy to cloudrun.env.yaml (git-ignored), fill in, and pass with:  --env-vars-file cloudrun.env.yaml
# Secrets (DB_PASSWORD, JWT_SECRET) are NOT here — they come from Secret Manager via --set-secrets.

# JDBC URL of your free MySQL-compatible database. TLS is required for any database reached over the internet.
#   TiDB Cloud Serverless : jdbc:mysql://<host>:4000/influencehub?sslMode=VERIFY_IDENTITY
#   Aiven for MySQL       : jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
DB_URL: "jdbc:mysql://YOUR_DB_HOST:4000/influencehub?sslMode=VERIFY_IDENTITY"
DB_USER: "YOUR_DB_USER"

# Small pool: free DB plans allow few connections (pool size x max instances must stay below the cap).
DB_POOL_SIZE: "5"

# Your Firebase Hosting URLs (comma-separated). Fill in after the first frontend deploy.
CORS_ALLOWED_ORIGINS: "https://YOUR_PROJECT_ID.web.app,https://YOUR_PROJECT_ID.firebaseapp.com"
