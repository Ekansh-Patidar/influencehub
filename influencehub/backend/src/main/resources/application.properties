spring.application.name=backend

# ── Runtime configuration comes from environment variables (12-factor) ───────────────
# Defaults below are for local development only. In production (Cloud Run) every value is
# injected as an env var; secrets come from Secret Manager. See DEPLOYMENT.md.

# Cloud Run tells the container which port to listen on via $PORT (8080); locally we use 8082.
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/influencehub}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Free-tier databases cap concurrent connections: keep (pool size x max Cloud Run instances) under that cap.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
# Logging every SQL statement to stdout serialises request threads on the console lock
# and was a measurable latency cost under load (see NFR-PERF report). Enable only when debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Load lazy/eager associations for a whole result page with one IN (...) query instead of one per row (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# No default on purpose: the app refuses to start without a signing secret.
jwt.secret=${JWT_SECRET}
# NFR-SEC (Report 4.2.2.2): max JWT lifetime of 15 minutes
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

# Comma-separated list of frontend origins allowed to call the API (CORS).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Local-only secrets (DB password, JWT secret) live in backend/secrets.properties, which is
# git-ignored. It is optional, so production (where it does not exist) uses env vars instead.
spring.config.import=optional:file:./secrets.properties
