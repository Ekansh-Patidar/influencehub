# Test-only configuration: shadows src/main/resources/application.properties.
# The NFR suite runs against an isolated in-memory H2 database (MySQL compatibility mode),
# so it never touches the developer's MySQL data.
spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:nfr_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# keep in sync with src/main/resources/application.properties
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Lets the performance suite count SQL statements per HTTP request (N+1 detection)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

jwt.secret=nfr_test_suite_secret_key_that_is_at_least_32_bytes_long
jwt.expiration-minutes=15
